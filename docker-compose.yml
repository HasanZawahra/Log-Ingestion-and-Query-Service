services:
  db:
    image: postgres:16-alpine
    cpus: "1.0"
    mem_limit: 1g
    command: postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB -c max_wal_size=2GB -c checkpoint_timeout=1800 -c wal_compression=zstd -c synchronous_commit=off
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    cpus: "0.5"
    mem_limit: 256m
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
